name: tjr-funded-notify

# MAIN: pushes today's TJR session-liquidity + FVG day-trade PLAN via ntfy (free, laptop
# closed), funded-sized for a 50k eval. The TJR method is funded-LEGAL (intraday, hard stop
# beyond the raid, target = opposite liquidity pool, EOD-flat). It has NO validated money
# edge (HANDOFF 16/19-20) — it is a disciplined, rule-based way to take the trade and ride
# the eval's variance. Switch STRATEGY back to 'funded' for the firm-rules coach instead.
#
# *** PAPER ONLY. Never places an order. Maximises the CHANCE to pass; it does not make
#     money — funded payouts require an edge that does not exist on free data. ***
#
# One push per weekday, ~16:00 AST / pre-US-open, so the plan lands before you trade.

on:
  schedule:
    - cron: "0 13 * * 1-5"   # 13:00 UTC = 16:00 AST (pre-US-open)
  workflow_dispatch: {}        # manual run from the Actions tab

jobs:
  funded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Push TJR funded plan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STRATEGY: tjr                  # MAIN method: TJR session-liquidity + FVG plan
          FUNDED_SYMBOL: MNQ             # micro Nasdaq (or MES for the calmer S&P)
          FUNDED_ACCOUNT: "50000"
          FUNDED_RISK_PCT: "0.75"
        run: python notify.py
